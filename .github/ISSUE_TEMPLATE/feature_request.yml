name: 功能建议
description: 建议新的业务能力或现有流程改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 说明要解决的问题、涉及的角色和当前处理方式。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的流程、数据和界面行为。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明已经考虑过的其他做法或临时方案。

  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 说明是否涉及权限、财务、库存、迁移、API 或兼容性。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 内容中不包含敏感信息或真实业务数据。
          required: true
